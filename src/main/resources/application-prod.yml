# 生产环境配置
spring:
  profiles:
    active: prod
  
  # 数据源配置
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        generate_statistics: false
    open-in-view: false
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: -1ms
  
  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 1800000  # 30分钟
      cache-null-values: false
  
  # 邮件配置
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${MAIL_HOST}
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  
  # Jackson配置
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# 服务器配置
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  # 生产环境SSL配置（如果需要）
  # ssl:
  #   key-store: ${SSL_KEYSTORE_PATH}
  #   key-store-password: ${SSL_KEYSTORE_PASSWORD}
  #   key-store-type: PKCS12

# 日志配置
logging:
  level:
    com.wanli: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/wanli-backend-prod.log
    max-size: 200MB
    max-history: 60
    total-size-cap: 5GB

# 应用配置
app:
  # JWT配置
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 86400000  # 24小时
    refresh-token-expiration: 604800000  # 7天
  
  # 安全配置
  security:
    cors:
      allowed-origins:
        - ${FRONTEND_URL}
        - ${ADMIN_URL}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    
    rate-limit:
      enabled: true
      requests-per-minute: 30
      burst-capacity: 60
  
  # 文件存储配置
  storage:
    type: ${STORAGE_TYPE:cloud}
    local:
      upload-dir: ${UPLOAD_DIR:/app/uploads}
      base-url: ${BASE_URL}/files
    cloud:
      bucket: ${CLOUD_BUCKET}
      region: ${CLOUD_REGION}
      access-key: ${CLOUD_ACCESS_KEY}
      secret-key: ${CLOUD_SECRET_KEY}
      cdn-url: ${CDN_URL}
  
  # 邮件模板配置
  mail:
    templates:
      verification: classpath:templates/email-verification.html
      password-reset: classpath:templates/password-reset.html
    from: ${MAIL_FROM}
    from-name: 万里教育平台

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
  security:
    enabled: true

# API文档配置（生产环境可选择关闭）
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: 万里教育平台API
    description: 万里教育平台后端服务API文档
    version: 1.0.0
    contact:
      name: 技术支持
      email: support@wanli.edu